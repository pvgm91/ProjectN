<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Radar de Preços · Project N</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: cabecalho fixo com tres abas (Ofertas, Produtos, ficha do produto).
   Ofertas em cartoes; Produtos em lista densa com mini grafico; ficha com grafico grande. */
:root {
  --bg: #f5f2f2; --surface: #ffffff; --sunk: #efeaea; --ink: #1c1416; --muted: #6e6265; --line: #e4dcdd;
  --accent: #d0021b; --accent-ink: #ffffff; --accent-soft: #fbe7ea;
  --good: #137347; --good-soft: #e1f2e9; --warn: #8a5300; --warn-soft: #fbefd8; --off: #5b5658; --off-soft: #ece8e8;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #131011; --surface: #1d1819; --sunk: #181415; --ink: #f2ecec; --muted: #a39799; --line: #332a2c;
  --accent: #ff4b5f; --accent-ink: #1a0709; --accent-soft: #3a171d;
  --good: #5cd197; --good-soft: #15301f; --warn: #f0b955; --warn-soft: #362812; --off: #b3aaac; --off-soft: #2a2425;
  color-scheme: dark; } }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); -webkit-text-size-adjust: 100% }
button, input, select { font: inherit; color: inherit }
a { color: inherit }
.wrap { max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px) }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-block: 14px 8px }
.marca { font: 700 20px/1.1 var(--display); letter-spacing: -0.01em; margin: 0 }
.marca b { color: var(--accent) }
.atualizado { color: var(--muted); font-size: 12px }
.sair { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0 0 0 6px }
nav { display: flex; gap: 2px }
nav a { text-decoration: none; padding: 9px 12px 10px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent) }
nav a span { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--muted) }

main { padding-block: 16px 64px }
.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px }
.busca { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface) }
select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); max-width: 100% }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500 }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.chip span { font-variant-numeric: tabular-nums; opacity: .7 }
.marcar { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer }
.contagem { color: var(--muted); font-size: 12px; margin: -4px 0 10px }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Ofertas */
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0 }
.oferta { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px }
.oferta.apagada { opacity: .55 }
.foto { width: 84px; height: 84px; border-radius: 8px; background: #fff; object-fit: contain; border: 1px solid var(--line) }
.cat { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted) }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; letter-spacing: .02em }
.pill.valendo { background: var(--good-soft); color: var(--good) }
.pill.subiu, .pill.semlink { background: var(--warn-soft); color: var(--warn) }
.pill.sumiu, .pill.postada { background: var(--off-soft); color: var(--off) }
.pill.menor { background: var(--accent-soft); color: var(--accent) }
h2.titulo { font: 600 15px/1.3 var(--body); margin: 4px 0 6px; overflow-wrap: anywhere }
.preco { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-variant-numeric: tabular-nums }
.preco strong { font: 700 22px/1.1 var(--display) }
.preco s { color: var(--muted) }
.desc { font: 700 13px/1 var(--display); color: var(--accent-ink); background: var(--accent); padding: 4px 6px; border-radius: 5px }
.meta { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere }
.acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: none; line-height: 1 }
.btn:hover { border-color: var(--muted) }
.btn.forte { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.vazio { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center }
textarea.copia { width: 100%; min-height: 160px; margin-top: 8px; font: 12px/1.4 ui-monospace, Consolas, monospace;
  background: var(--sunk); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px }

/* Produtos */
.lista { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.linha { display: grid; grid-template-columns: 48px minmax(0, 1fr) 120px 150px; gap: 12px; align-items: center;
  padding: 10px 14px; border-top: 1px solid var(--line); text-decoration: none }
.linha:first-child { border-top: 0 }
.linha:hover { background: var(--sunk) }
.linha .foto { width: 48px; height: 48px; border-radius: 6px }
.linha .nome { font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.linha .valor { text-align: right; font-variant-numeric: tabular-nums }
.linha .valor strong { font: 700 16px/1.2 var(--display); display: block }
.var { font-size: 12px; font-weight: 600 }
.var.baixo { color: var(--good) } .var.alto { color: var(--warn) } .var.neutro { color: var(--muted) }
svg.spark { width: 120px; height: 34px; display: block }
@media (max-width: 640px) {
  .linha { grid-template-columns: 44px minmax(0, 1fr) auto; }
  .linha svg.spark { display: none }
  .oferta { grid-template-columns: 64px minmax(0, 1fr) } .oferta .foto { width: 64px; height: 64px }
}
.mais { display: flex; justify-content: center; margin-top: 12px }

/* Ficha */
.voltar { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 12px }
.ficha { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 20px; align-items: start }
.ficha .foto { width: 160px; height: 160px }
@media (max-width: 640px) { .ficha { grid-template-columns: minmax(0, 1fr) } .ficha .foto { width: 120px; height: 120px } }
.ficha h1 { font: 700 22px/1.2 var(--display); margin: 4px 0 10px; text-wrap: balance; overflow-wrap: anywhere }
.numeros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 18px 0 }
.numeros div { background: var(--surface); padding: 10px 12px }
.numeros dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.numeros dd { margin: 2px 0 0; font: 700 17px/1.2 var(--display); font-variant-numeric: tabular-nums }
.numeros dd small { display: block; font: 500 11px/1.4 var(--body); color: var(--muted) }
@media (max-width: 520px) { .numeros { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.caixa { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px }
.caixa h3 { font: 700 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px }
.grafico { width: 100%; height: auto; display: block; overflow: visible }
.grafico text { fill: var(--muted); font: 11px var(--body) }
.nota { color: var(--muted); font-size: 12px; margin: 8px 0 0 }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
td, th { padding: 6px 4px; border-top: 1px solid var(--line); text-align: left; font-size: 13px }
th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0 }
td.n, th.n { text-align: right }
@media (prefers-reduced-motion: no-preference) { .oferta, .linha { transition: background .12s } }
/* Tela de senha */
.cofre { max-width: 360px; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 24px; display: flex; flex-direction: column; gap: 10px }
.cofre h1 { font: 700 22px/1.2 var(--display); margin: 0 }
.cofre label { font-size: 13px; font-weight: 600 }
.cofre input[type=password] { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg) }
.cofre .erro { color: var(--accent); font-size: 13px; margin: 0 }
.cofre .btn { justify-content: center; padding: 11px }
/* Gerador de arte */
dialog.arte { border: 0; padding: 0; border-radius: 14px; background: var(--surface); color: var(--ink);
  width: min(980px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog.arte::backdrop { background: rgba(10, 6, 7, .62) }
.arte-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line) }
.arte-topo h2 { font: 700 17px/1.2 var(--display); margin: 0 }
.arte-corpo { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; padding: 18px; overflow: auto; max-height: calc(100dvh - 90px) }
@media (max-width: 720px) { .arte-corpo { grid-template-columns: minmax(0, 1fr) } }
.arte-tela { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff;
  touch-action: none; cursor: grab; display: block }
.arte-tela:active { cursor: grabbing }
.arte-lado { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.arte-lado label { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 6px }
.arte-lado input[type=range] { width: 100%; accent-color: var(--accent) }
.arte-aviso { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn) }
.arte-ok { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--good-soft); color: var(--good) }
.arte-dica { font-size: 12px; color: var(--muted); margin: 0 }
.fechar { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <p class="marca"><b>Project N</b> · Radar de preços</p>
      <span class="atualizado"><span id="atualizado"></span> <button type="button" class="sair" id="sair" hidden>Sair</button></span>
    </div>
    <nav aria-label="Seções">
      <a href="#ofertas" id="nav-ofertas">Ofertas <span id="n-ofertas"></span></a>
      <a href="#produtos" id="nav-produtos">Produtos <span id="n-produtos"></span></a>
    </nav>
  </div>
</header>
<main class="wrap" id="tela"></main>

<script>
function iniciarPainel(D) {
  "use strict";
  var LOJAS = { amazon: "Amazon", shopee: "Shopee", mercadolivre: "Mercado Livre", eshop: "Nintendo eShop", manual: "Manual" };
  var PRODUTOS = D.produtos || [];
  var POR_K = {}; PRODUTOS.forEach(function (p) { POR_K[p.k] = p; });
  var OFERTA_DO_PRODUTO = {};
  D.ofertas.forEach(function (o) { if (o.produto && o.situacao === "valendo") OFERTA_DO_PRODUTO[o.produto] = o; });
  var tela = document.getElementById("tela");

  // ---------- utilidades ----------
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function ler(k, padrao) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } }
  var feitas = ler("pn_feitas", {});
  var estado = ler("pn_estado", { ofLoja: "todas", ofSit: "valendo", ofBusca: "", prBusca: "", prCat: "", prLoja: "", prOrdem: "queda", prMenor: false });
  function salvarEstado() { guardar("pn_estado", estado); }

  function R(cent) { return "R$ " + (cent / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function quando(min, comHora) {
    var d = new Date(min * 60000);
    var o = { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit" };
    if (comHora) { o.hour = "2-digit"; o.minute = "2-digit"; }
    return d.toLocaleString("pt-BR", o);
  }
  function semAcento(s) { return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
  function h(tag, attrs, filhos) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "texto") e.textContent = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    (filhos || []).forEach(function (f) { if (f != null) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }
  function foto(url, cls) {
    var i = h("img", { class: cls || "foto", alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
    if (url) i.src = url;
    return i;
  }
  function pctAbaixo(atual, ref) { return ref > 0 ? Math.round((ref - atual) / ref * 100) : 0; }
  // Quanto o produto esta barato agora: o maior entre o desconto sobre o preco "de" da loja
  // e a distancia do preco normal (mediana), esta so com 2 dias ou mais de historico.
  function desconto(p) { return Math.max(p.de ? (p.de - p.atual) / p.de : 0, p.dias > 1 ? (p.mediana - p.atual) / p.mediana : 0); }

  // ---------- texto do post (mesmo padrao do robo) ----------
  function totalParcelado(p) {
    var m = /(\d{1,2})x de R\$ ([\d.]+,\d{2})/.exec(p || "");
    return m ? parseInt(m[1], 10) * Math.round(parseFloat(m[2].replace(/\./g, "").replace(",", ".")) * 100) : 0;
  }
  function aVista(preco, p) { var t = totalParcelado(p); return t > 0 && t > preco * 1.01; }
  function textoDoProduto(p) {
    var v = aVista(p.atual, p.parcelas) ? " à vista" : "";
    var L = ["🔥 *[" + p.categoria + "] " + p.titulo + "* via " + (LOJAS[p.loja] || p.loja) + " 🇧🇷"];
    if (p.de > p.atual) L.push("De ~" + R(p.de) + "~ por *" + R(p.atual) + "*" + v + " (" + pctAbaixo(p.atual, p.de) + "% off)");
    else L.push("Por *" + R(p.atual) + "*" + v);
    if (p.parcelas) L.push((v ? "💳 Ou em até " : "💳 Em até ") + p.parcelas);
    if (p.vendedor) L.push("📦 Vendido por " + p.vendedor + (p.selo === "oficial" ? " (loja oficial)" : ""));
    L.push("", "👉 " + (p.link_curto || p.url), "", "📢 Entre no grupo de promoções do Project N:\n" + D.link_grupo);
    return L.join("\n");
  }
  function botaoCopiar(texto, rotulo) {
    var area = h("textarea", { class: "copia", readonly: true, "aria-label": "Texto do post" });
    area.value = texto; area.hidden = true;
    var b = h("button", { class: "btn forte", type: "button", texto: rotulo || "Copiar texto" });
    b.addEventListener("click", function () {
      function ok() { b.textContent = "Copiado"; setTimeout(function () { b.textContent = rotulo || "Copiar texto"; }, 1500); }
      function manual() { area.hidden = false; area.focus(); area.select(); b.textContent = "Selecionado: Ctrl+C"; }
      try { navigator.clipboard.writeText(texto).then(ok, manual); } catch (e) { manual(); }
    });
    return [b, area];
  }

  // ---------- graficos ----------
  function serie(p, ateAgora) {
    var pts = p.pontos.map(function (x) { return [x[0], x[1]]; });
    if (ateAgora && pts.length && p.visto > pts[pts.length - 1][0]) pts.push([p.visto, pts[pts.length - 1][1]]);
    return pts;
  }
  function caminhoDegraus(pts, X, Y) {
    var d = "";
    pts.forEach(function (q, i) {
      if (i === 0) d += "M" + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1);
      else d += "H" + X(q[0]).toFixed(1) + "V" + Y(q[1]).toFixed(1);
    });
    return d;
  }
  var NS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) { var e = document.createElementNS(NS, tag); Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); }); return e; }

  function sparkline(p) {
    var W = 120, H = 34, pts = serie(p, true);
    var svg = s("svg", { class: "spark", viewBox: "0 0 " + W + " " + H, "aria-hidden": "true" });
    if (!pts.length) return svg;
    var t0 = pts[0][0], t1 = pts[pts.length - 1][0], lo = p.menor, hi = p.maior;
    var X = function (t) { return t1 > t0 ? 2 + (t - t0) / (t1 - t0) * (W - 4) : W / 2; };
    var Y = function (v) { return hi > lo ? 4 + (hi - v) / (hi - lo) * (H - 8) : H / 2; };
    if (pts.length === 1) {          // um registro so: linha reta de ponta a ponta
      pts = [[t0, pts[0][1]], [t0 + 1, pts[0][1]]];
      X = function (t) { return t === t0 ? 2 : W - 2; };
    }
    svg.appendChild(s("path", { d: caminhoDegraus(pts, X, Y), fill: "none", stroke: "var(--muted)", "stroke-width": "1.5", "stroke-linejoin": "round" }));
    var ult = pts[pts.length - 1];
    svg.appendChild(s("circle", { cx: X(ult[0]), cy: Y(ult[1]), r: "2.6", fill: p.atual <= p.menor && p.dias > 1 ? "var(--accent)" : "var(--ink)" }));
    return svg;
  }

  function graficoGrande(p) {

      carregarImg(grande, true).catch(function () { return grande !== url ? carregarImg(url, true) : Promise.reject(); })
        .then(function (img) { usarFoto(img, true); })
        .catch(function () { return carregarImg(grande, false).then(function (img) { usarFoto(img, false); }); })
        .catch(function () { avisar("Não foi possível abrir a foto da loja. Use \"Trocar foto\"."); });
    }
    function deArquivo(blob) {
      if (!blob || !/^image\//.test(blob.type)) return;
      var u = URL.createObjectURL(blob);
      carregarImg(u, false).then(function (img) { usarFoto(img, true); avisar("Foto trocada.", true); });
    }
    function gerarBlob(tipo, q) { return new Promise(function (ok, erro) { try { tela.toBlob(function (b) { b ? ok(b) : erro(); }, tipo, q); } catch (e) { erro(e); } }); }

    zoom.addEventListener("input", function () { estadoArte.z = zoom.value / 100; desenhar(); });
    arquivo.addEventListener("change", function () { deArquivo(arquivo.files[0]); arquivo.value = ""; });
    var arrasto = null;
    tela.addEventListener("pointerdown", function (e) { tela.setPointerCapture(e.pointerId); arrasto = { x: e.clientX, y: e.clientY, dx: estadoArte.dx, dy: estadoArte.dy }; });
    tela.addEventListener("pointermove", function (e) {
      if (!arrasto) return;
      var k = ARTE.tam / tela.getBoundingClientRect().width;
      estadoArte.dx = arrasto.dx + (e.clientX - arrasto.x) * k; estadoArte.dy = arrasto.dy + (e.clientY - arrasto.y) * k; desenhar();
    });
    tela.addEventListener("pointerup", function () { arrasto = null; });
    tela.addEventListener("wheel", function (e) {
      e.preventDefault(); zoom.value = Math.max(40, Math.min(250, +zoom.value - Math.sign(e.deltaY) * 6)); estadoArte.z = zoom.value / 100; desenhar();
    }, { passive: false });
    btnBaixar.addEventListener("click", function () {
      gerarBlob("image/jpeg", 0.92).then(function (b) {
        var a = h("a", { href: URL.createObjectURL(b), download: (nomeArquivo || "promo") + ".jpg" });
        document.body.appendChild(a); a.click(); a.remove(); avisar("Arte baixada.", true);
      }).catch(function () { liberar(false); });
    });
    btnCopiar.addEventListener("click", function () {
      if (!window.ClipboardItem || !navigator.clipboard || !navigator.clipboard.write) { avisar("Este navegador não copia imagens. Use \"Baixar JPG\"."); return; }
      navigator.clipboard.write([new ClipboardItem({ "image/png": gerarBlob("image/png") })])
        .then(function () { avisar("Imagem copiada. No WhatsApp Web, cole com Ctrl+V.", true); })
        .catch(function () { avisar("Não foi possível copiar. Use \"Baixar JPG\"."); });
    });

    dlg = h("dialog", { class: "arte", id: "dlg-arte", "aria-label": "Gerar arte" }, [
      h("div", { class: "arte-topo" }, [h("h2", { texto: "Gerar arte" }),
        h("button", { class: "fechar", type: "button", "aria-label": "Fechar", texto: "×", onclick: function () { dlg.close(); } })]),
      h("div", { class: "arte-corpo" }, [
        h("div", null, [tela, h("p", { class: "arte-dica", texto: "Arraste a foto para posicionar. A roda do mouse aumenta ou diminui." })]),
        h("div", { class: "arte-lado" }, [
          h("div", { class: "meta", texto: titulo }),
          h("label", { for: "arte-zoom" }, ["Zoom da foto", zoom]),
          h("div", { class: "acoes" }, [
            h("button", { class: "btn", type: "button", texto: "Centralizar", onclick: function () { estadoArte.dx = estadoArte.dy = 0; estadoArte.z = 1; zoom.value = "100"; desenhar(); } }),
            h("button", { class: "btn", type: "button", texto: "Trocar foto", onclick: function () { arquivo.click(); } }), arquivo]),
          aviso,
          h("div", { class: "acoes" }, [btnCopiar, btnBaixar]),
          h("p", { class: "arte-dica", texto: "Sai em 1080×1080, no modelo PROMO do Project N. Também dá para colar uma foto aqui com Ctrl+V." })
        ])
      ])
    ]);
    dlg.addEventListener("close", function () { document.removeEventListener("paste", colar); dlg.remove(); });
    function colar(e) {
      var itens = (e.clipboardData && e.clipboardData.items) || [];
      for (var i = 0; i < itens.length; i++) if (itens[i].type.indexOf("image/") === 0) { e.preventDefault(); deArquivo(itens[i].getAsFile()); return; }
    }
    document.addEventListener("paste", colar);
    document.body.appendChild(dlg);
    dlg.showModal();
    desenhar();
    var prontas = molduras ? Promise.resolve() : Promise.all([carregarImg("arte/promo_base.png", true), carregarImg("arte/promo_topo.png", true)])
      .then(function (m) { molduras = { base: m[0], topo: m[1] }; })
      .catch(function () { avisar("Não encontrei a moldura (pasta arte/ do painel). Rode rodar.bat painel para publicá-la."); });
    prontas.then(function () { desenhar(); carregarDaLoja(urlFoto); });
  }
  function nomeDoArquivo(t) { return "promo-" + semAcento(t).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50); }

  // ---------- rotas ----------
  document.getElementById("n-ofertas").textContent = D.ofertas.filter(function (o) { return o.situacao === "valendo" && !feitas[chaveOferta(o)]; }).length;
  document.getElementById("n-produtos").textContent = PRODUTOS.length;
  document.getElementById("atualizado").textContent = "Atualizado em " + new Date(D.gerado_em).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  var rotaAnterior = "";
  function rota() {
    var hs = location.hash.replace("#", "");
    if (hs.indexOf("p-") !== 0) rotaAnterior = hs || "ofertas";
    if (hs.indexOf("p-") === 0) telaProduto(parseInt(hs.slice(2), 10));
    else if (hs === "produtos") telaProdutos();
    else telaOfertas();
  }
  window.addEventListener("hashchange", rota);
  var sair = document.getElementById("sair");
  if (JSON.parse(document.getElementById("dados").textContent).cifrado) {
    sair.hidden = false;
    sair.addEventListener("click", function () {
      try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf("pn_chave_") === 0) localStorage.removeItem(k); }); } catch (x) {}
      location.reload();
    });
  }
  rota();
}

// ---------- entrada: dados abertos ou protegidos por senha ----------
(function () {
  "use strict";
  var bruto = JSON.parse(document.getElementById("dados").textContent);
  if (!bruto.cifrado) { iniciarPainel(bruto); return; }
  var CHAVE_LOCAL = "pn_chave_" + bruto.sal;
  function b64(t) { var s = atob(t), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function emB64(buf) { var s = "", a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function abrir(chave) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(bruto.iv) }, chave, b64(bruto.dados))
      .then(function (claro) { return JSON.parse(new TextDecoder().decode(claro)); });
  }
  function chaveDaSenha(senha) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(bruto.sal), iterations: bruto.iteracoes, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function chaveCrua(raw) { return crypto.subtle.importKey("raw", b64(raw), { name: "AES-GCM" }, true, ["decrypt"]); }
  var tela = document.getElementById("tela");
  document.querySelector("nav").hidden = true;
  function pedirSenha(erro) {
    tela.innerHTML = "";
    var form = document.createElement("form");
    form.className = "cofre";
    form.innerHTML = '<h1>Painel restrito</h1><p class="meta">Digite a senha do painel de promoções do Project N.</p>' +
      '<label for="senha-painel">Senha</label><input id="senha-painel" type="password" autocomplete="current-password" required>' +
      '<label class="marcar" for="lembrar-painel"><input id="lembrar-painel" type="checkbox" checked> Lembrar neste navegador</label>' +
      '<p class="erro" id="erro-senha" hidden></p><button class="btn forte" type="submit">Entrar</button>';
    tela.appendChild(form);
    var campo = form.querySelector("#senha-painel"), err = form.querySelector("#erro-senha");
    if (erro) { err.textContent = erro; err.hidden = false; }
    campo.focus();
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var botao = form.querySelector("button"); botao.disabled = true; botao.textContent = "Abrindo…";
      chaveDaSenha(campo.value).then(function (chave) {
        return abrir(chave).then(function (D) {
          if (form.querySelector("#lembrar-painel").checked) {
            crypto.subtle.exportKey("raw", chave).then(function (raw) { try { localStorage.setItem(CHAVE_LOCAL, emB64(raw)); } catch (x) {} });
          }
          document.querySelector("nav").hidden = false; iniciarPainel(D);
        });
      }).catch(function () { pedirSenha("Senha incorreta."); });
    });
  }
  if (!window.crypto || !crypto.subtle) { tela.innerHTML = '<p class="vazio">Este navegador não consegue abrir o painel protegido. Use o Chrome, o Edge ou o Safari atualizados.</p>'; return; }
  var guardada = null;
  try { guardada = localStorage.getItem(CHAVE_LOCAL); } catch (x) {}
  if (!guardada) { pedirSenha(); return; }
  chaveCrua(guardada).then(abrir).then(function (D) { document.querySelector("nav").hidden = false; iniciarPainel(D); })
    .catch(function () { try { localStorage.removeItem(CHAVE_LOCAL); } catch (x) {} pedirSenha(); });
})();
</script>
